repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: bash -c "cd extension && npm run lint"
        language: system
        files: \.(js|jsx|ts|tsx)$
        pass_filenames: false

      - id: tsc
        name: tsc
        entry: bash -c "cd extension && npx tsc --noEmit"
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false
