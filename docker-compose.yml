services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trust-me-bro-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Mount thu muc data de luu tru SQLite metrics.db khong bi mat khi xoa container
      - ./backend/data:/app/data
      # Mount app de hot-reload ngay khi ban sua code o may host
      - ./backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # Service ho tro tu dong build extension (neu ban khong muon cai Node tren may host)
  extension-builder:
    image: node:22-alpine
    container_name: trust-me-bro-extension-builder
    working_dir: /app
    volumes:
      - ./extension:/app
    # Mac dinh chay vite build --watch de tu dong xuat ra extension/dist tren may host
    command: ["sh", "-c", "npm install && npm run dev"]
